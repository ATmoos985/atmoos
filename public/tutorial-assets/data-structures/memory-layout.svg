<svg xmlns="http://www.w3.org/2000/svg" width="1343" height="628" viewBox="26 -4 1343 628" role="img" aria-labelledby="title"><title id="title">顺序表与链表的内存布局</title>
<text fill="#1e3a8a" opacity="1" font-size="28" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="700" y="48">顺序表与链表的内存布局</tspan></text>
<text fill="#475569" opacity="1" font-size="18" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="700" y="82">同一个线性关系，在机器中可以拥有完全不同的地址组织与操作代价</tspan></text>
<rect x="50" y="125" width="390" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text fill="#2563eb" opacity="1" font-size="20" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="245" y="159">顺序表：连续地址</tspan></text>
<text fill="#0f172a" opacity="1" font-size="17" text-anchor="start" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="72" y="197">序列 A, B, C；示例 w=4 字节</tspan><tspan x="72" y="218.25">1000 A  |  1004 B</tspan><tspan x="72" y="239.5">1008 C  |  1012 空</tspan><tspan x="72" y="260.75"></tspan><tspan x="72" y="282">随机读取：base + i × w</tspan></text>
<rect x="50" y="395" width="390" height="205" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text fill="#2563eb" opacity="1" font-size="20" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="245" y="429">在 0-based 下标 1 插入 X</tspan></text>
<text fill="#0f172a" opacity="1" font-size="17" text-anchor="start" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="72" y="467">等价于 1-based 位序 2 插入</tspan><tspan x="72" y="488.25">移动 C：1008 → 1012</tspan><tspan x="72" y="509.5">移动 B：1004 → 1008</tspan><tspan x="72" y="530.75">写入 X：1004</tspan><tspan x="72" y="552">结果：A | X | B | C</tspan></text>
<defs><marker id="arrow-8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs><polyline points="245,315 245,385" fill="none" stroke="#2563eb" stroke-width="2" opacity="1" marker-end="url(#arrow-8)"/>
<text fill="#2563eb" opacity="1" font-size="15" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="245" y="350">移动后写入</tspan></text>
<rect x="525" y="125" width="390" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" opacity="1"/>
<text fill="#7c3aed" opacity="1" font-size="20" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="720" y="159">单链表：地址可以离散</tspan></text>
<text fill="#0f172a" opacity="1" font-size="17" text-anchor="start" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="547" y="197">A@1040 ──next──&gt; B@7F20</tspan><tspan x="547" y="218.25">B@7F20 ──next──&gt; C@2210</tspan><tspan x="547" y="239.5">C@2210 ──next──&gt; NULL</tspan><tspan x="547" y="260.75"></tspan><tspan x="547" y="282">第 i 个元素必须沿 next 逐结点访问</tspan></text>
<rect x="525" y="395" width="390" height="205" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" opacity="1"/>
<text fill="#7c3aed" opacity="1" font-size="20" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="720" y="429">已知 A 后插入 X</tspan></text>
<text fill="#0f172a" opacity="1" font-size="16" text-anchor="start" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="547" y="466">1. X.next = A.next</tspan><tspan x="547" y="486">2. A.next = X</tspan><tspan x="547" y="506">A@1040 --&gt; X@9000 --&gt;</tspan><tspan x="547" y="526">B@7F20 --&gt; C@2210</tspan><tspan x="547" y="546">只改两个指针；</tspan><tspan x="547" y="566">若先找位置，定位仍需 O(n)。</tspan></text>
<defs><marker id="arrow-16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker></defs><polyline points="720,315 720,385" fill="none" stroke="#7c3aed" stroke-width="2" opacity="1" marker-end="url(#arrow-16)"/>
<text fill="#7c3aed" opacity="1" font-size="15" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="720" y="350">改写链接</tspan></text>
<rect x="995" y="125" width="350" height="475" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" opacity="1"/>
<text fill="#0f766e" opacity="1" font-size="20" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="1170" y="159">选择依据</tspan></text>
<text fill="#0f172a" opacity="1" font-size="16" text-anchor="start" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="1017" y="196">顺序表</tspan><tspan x="1017" y="216">• 按下标访问 O(1)</tspan><tspan x="1017" y="236">• 插删可能搬移元素</tspan><tspan x="1017" y="256">• 连续布局，缓存局部性好</tspan><tspan x="1017" y="276">• 扩容可能整体复制</tspan><tspan x="1017" y="296"></tspan><tspan x="1017" y="316">链表</tspan><tspan x="1017" y="336">• 按位置访问 O(n)</tspan><tspan x="1017" y="356">• 已知结点后局部插删 O(1)</tspan><tspan x="1017" y="376">• 每个结点带指针开销</tspan><tspan x="1017" y="396">• 分配离散，局部性较弱</tspan><tspan x="1017" y="416"></tspan><tspan x="1017" y="436">结论</tspan><tspan x="1017" y="456">先看工作负载，再选择表示；</tspan><tspan x="1017" y="476">不能只背单个复杂度。</tspan></text>
</svg>
