<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="828" viewBox="31 -4 1248 828" role="img" aria-labelledby="title"><title id="title">数据结构的三个观察层次</title>
<text fill="#1e3a8a" opacity="1" font-size="27" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="568.5" y="47">数据结构的三个观察层次</tspan></text>
<text fill="#475569" opacity="1" font-size="18" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="535" y="79">从问题契约出发，同时观察关系、机器表示和操作过程</tspan></text>
<rect x="410" y="105" width="380" height="82" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2" opacity="1"/>
<text fill="#0f172a" opacity="1" font-size="17" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="586" y="136">实际问题与 ADT 契约</tspan><tspan x="586" y="157.25">输入、输出、关系和允许的操作</tspan></text>
<rect x="55" y="265" width="310" height="205" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" opacity="1"/>
<text fill="#5b21b6" opacity="1" font-size="17" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="184.5" y="303">逻辑结构</tspan><tspan x="184.5" y="324.25"></tspan><tspan x="184.5" y="345.5">元素之间是什么关系</tspan><tspan x="184.5" y="366.75">集合、线性、树形、图</tspan><tspan x="184.5" y="388"></tspan><tspan x="184.5" y="409.25">示例：List = (A, B, C)</tspan><tspan x="184.5" y="430.5">只说明顺序，不说明地址</tspan></text>
<rect x="445" y="265" width="310" height="205" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text fill="#1d4ed8" opacity="1" font-size="17" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="578.5" y="303">存储结构</tspan><tspan x="578.5" y="324.25"></tspan><tspan x="578.5" y="345.5">元素和关系怎样编码</tspan><tspan x="578.5" y="366.75">顺序、链式、索引、散列</tspan><tspan x="578.5" y="388"></tspan><tspan x="578.5" y="409.25">A | B | C</tspan><tspan x="578.5" y="430.5">或 A -&gt; B -&gt; C</tspan></text>
<rect x="835" y="265" width="310" height="205" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" opacity="1"/>
<text fill="#115e59" opacity="1" font-size="16" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="964.4799499511719" y="302">操作与算法</tspan><tspan x="964.4799499511719" y="322"></tspan><tspan x="964.4799499511719" y="342">怎样查询和改变状态</tspan><tspan x="964.4799499511719" y="362">Get、Insert、Delete、</tspan><tspan x="964.4799499511719" y="382">Traverse</tspan><tspan x="964.4799499511719" y="402"></tspan><tspan x="964.4799499511719" y="422">每一步必须维护</tspan><tspan x="964.4799499511719" y="442">逻辑约束和存储不变量</tspan></text>
<defs><marker id="arrow-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker></defs><polyline points="500,187 225,265" fill="none" stroke="#7c3aed" stroke-width="2" opacity="1" marker-end="url(#arrow-10)"/>
<defs><marker id="arrow-11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs><polyline points="600,187 600,265" fill="none" stroke="#2563eb" stroke-width="2" opacity="1" marker-end="url(#arrow-11)"/>
<defs><marker id="arrow-12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker></defs><polyline points="700,187 975,265" fill="none" stroke="#0f766e" stroke-width="2" opacity="1" marker-end="url(#arrow-12)"/>
<rect x="380" y="535" width="440" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" opacity="1"/>
<text fill="#92400e" opacity="1" font-size="17" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="576.9499664306641" y="572">具体实现</tspan><tspan x="576.9499664306641" y="593.25">结构定义 + 状态约定 + 操作步骤</tspan><tspan x="576.9499664306641" y="614.5">同一 ADT 可以形成多种实现</tspan></text>
<defs><marker id="arrow-15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker></defs><polyline points="210,470 475,550" fill="none" stroke="#7c3aed" stroke-width="2" opacity="1" marker-end="url(#arrow-15)"/>
<defs><marker id="arrow-16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs><polyline points="600,470 600,535" fill="none" stroke="#2563eb" stroke-width="2" opacity="1" marker-end="url(#arrow-16)"/>
<defs><marker id="arrow-17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker></defs><polyline points="990,470 725,550" fill="none" stroke="#0f766e" stroke-width="2" opacity="1" marker-end="url(#arrow-17)"/>
<rect x="150" y="705" width="360" height="95" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2" opacity="1"/>
<text fill="#9f1239" opacity="1" font-size="16" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="303" y="740">正确性</tspan><tspan x="303" y="760">前置条件、不变量、终止性</tspan><tspan x="303" y="780">操作后仍满足逻辑约束</tspan></text>
<rect x="690" y="705" width="360" height="95" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" opacity="1"/>
<text fill="#075985" opacity="1" font-size="16" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><tspan x="832" y="740">效率与边界</tspan><tspan x="832" y="760">时间、辅助空间、局部性</tspan><tspan x="832" y="780">退化输入和资源限制</tspan></text>
<defs><marker id="arrow-22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#be123c" stroke-width="1.5"/></marker></defs><polyline points="500,635 330,705" fill="none" stroke="#be123c" stroke-width="2" opacity="1" marker-end="url(#arrow-22)"/>
<defs><marker id="arrow-23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0369a1" stroke-width="1.5"/></marker></defs><polyline points="700,635 870,705" fill="none" stroke="#0369a1" stroke-width="2" opacity="1" marker-end="url(#arrow-23)"/>
</svg>
